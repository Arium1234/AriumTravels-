<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arium Holidays - Connect With Us</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1f4068, #162447, #1b1b2f);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        .logo-container {
            width: 90px;
            height: 90px;
            margin: 0 auto 15px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #ffffff;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .logo-container i {
            font-size: 38px;
            color: #162447;
        }
        h1 { font-size: 24px; margin-bottom: 5px; color: #ffffff; }
        p.subtitle { font-size: 14px; color: #b0c4de; margin-bottom: 5px; }
        .powered-by {
            font-size: 12px;
            color: #25d366;
            margin-bottom: 25px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        .social-links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 12px 20px;
            border-radius: 50px;
            text-decoration: none;
            color: #ffffff;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .btn i { font-size: 20px; }
        .btn-instagram {
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
        }
        .btn-facebook { background: #1877f2; }
        .btn-twitter { background: #000000; border: 1px solid #333; }
        .btn-whatsapp { background: #25d366; }
        .btn-email { background: #d44638; }
        .btn:hover { transform: translateY(-3px); opacity: 0.95; }
        .form-section {
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 15px;
            text-align: left;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .form-section h3 {
            font-size: 18px;
            margin-bottom: 15px;
            text-align: center;
            color: #25d366;
        }
        .input-group { margin-bottom: 12px; }
        .input-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 5px;
            color: #cfd8dc;
        }
        .input-group input,
        .input-group textarea {
            width: 100%;
            padding: 10px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }
        .input-group textarea {
            resize: vertical;
            height: 80px;
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #25d366;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .submit-btn:hover { background: #20ba5a; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <i class="fa-solid fa-umbrella-beach"></i>
        </div>

        <h1>Arium Holidays</h1>
        <p class="subtitle">Plan your dream vacation with us</p>
        <div class="powered-by">Powered By: Arium Travels</div>

        <div class="social-links">
            <a href="https://instagram.com/AapkaInstagramUsername" target="_blank" class="btn btn-instagram">
                <i class="fa-brands fa-instagram"></i> Follow on Instagram
            </a>

            <a href="https://facebook.com/AapkaFacebookPage" target="_blank" class="btn btn-facebook">
                <i class="fa-brands fa-facebook-f"></i> Connect on Facebook
            </a>

            <a href="https://x.com/AapkaXUsername" target="_blank" class="btn btn-twitter">
                <i class="fa-brands fa-x-twitter"></i> Follow on X (Twitter)
            </a>

            <a href="https://wa.me/919889890368?text=Hello,%20mujhe%20Arium%20Holidays%20ke%20packages%20ke%20bare%20mein%20jaankari%20chahiye." target="_blank" class="btn btn-whatsapp">
                <i class="fa-brands fa-whatsapp"></i> Chat on WhatsApp
            </a>

            <a href="mailto:Sales@ariumtravels.com" class="btn btn-email">
                <i class="fa-solid fa-envelope"></i> Email Us
            </a>
        </div>

        <div class="form-section">
            <h3><i class="fa-solid fa-paper-plane"></i> Quick Enquiry</h3>

            <form id="whatsappForm" onsubmit="sendToWhatsApp(event)">
                <div class="input-group">
                    <label for="name">Aapka Naam:</label>
                    <input type="text" id="name" placeholder="Apna naam likhein" required>
                </div>

                <div class="input-group">
                    <label for="phone">Phone Number:</label>
                    <input type="tel" id="phone" placeholder="Apna mobile number" required>
                </div>

                <div class="input-group">
                    <label for="message">Message / Enquiry:</label>
                    <textarea id="message" placeholder="Aap kahan ghumne jana chahte hain?" required></textarea>
                </div>

                <button type="submit" class="submit-btn">
                    <i class="fa-brands fa-whatsapp"></i> Send to WhatsApp
                </button>
            </form>
        </div>
    </div>

    <script>
        function sendToWhatsApp(event) {
            event.preventDefault();

            const whatsappNumber = "919889890368";
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const message = document.getElementById('message').value;

            const url = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(
                `*New Holiday Enquiry (Arium Holidays)*\n\n*Name:* ${name}\n*Phone:* ${phone}\n*Message:* ${message}`
            )}`;

            window.open(url, '_blank');
        }
    </script>
</body>
</html>
