<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arium Holidays | Powered By Arium Travels</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0a1128 0%, #1c2d59 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        .logo-container {
            width: 130px;
            height: 130px;
            margin: 0 auto 15px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            background: #ffffff;
        }
        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }
        .tagline {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 25px;
            font-weight: 400;
        }
        .services-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }
        .service-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .service-card i {
            color: #38bdf8;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }
        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            color: #ffffff;
            transition: transform 0.2s ease, opacity 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .social-btn:active {
            transform: scale(0.98);
        }
        .instagram { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
        .facebook { background: #1877f2; }
        .twitter { background: #000000; border: 1px solid #333; }
        .whatsapp { background: #25d366; }
        .email-btn { background: #ea4335; }

        .enquiry-box {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 20px;
            text-align: left;
            margin-bottom: 20px;
        }
        .enquiry-box h3 {
            font-size: 16px;
            color: #38bdf8;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            color: #cbd5e1;
            margin-bottom: 5px;
        }
        .form-control {
            width: 100%;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #ffffff;
            font-size: 13px;
            outline: none;
        }
        .form-control::placeholder {
            color: #64748b;
        }
        .submit-btn {
            width: 100%;
            background: #25d366;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin-top: 5px;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
        }
        .founder-section {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 15px;
            margin-top: 15px;
            font-size: 13px;
            color: #94a3b8;
        }
        .founder-section span {
            color: #ffffff;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo -->
        <div class="logo-container">
            <img src="45288.png" alt="Arium Holidays Logo">
        </div>

        <h1>Arium Holidays</h1>
        <p class="tagline">Plan your dream vacation with us<br><span style="font-size: 12px; color: #38bdf8;">Powered By: ARIUM Travels</span></p>

        <!-- Services Highlights -->
        <div class="services-grid">
            <div class="service-card"><i class="fas fa-plane"></i> Flights</div>
            <div class="service-card"><i class="fas fa-hotel"></i> Hotels</div>
            <div class="service-card"><i class="fas fa-umbrella-beach"></i> Holidays</div>
            <div class="service-card"><i class="fas fa-globe"></i> International</div>
        </div>

        <!-- Social Links Buttons -->
        <div class="btn-group">
            <a href="https://www.instagram.com/ariumtravels?stkn=MW42bW94dzFkc2R2MA==" target="_blank" class="social-btn instagram">
                <i class="fab fa-instagram"></i> Follow on Instagram
            </a>
            <a href="https://www.facebook.com/share/1Ei2sTT6kd/" target="_blank" class="social-btn facebook">
                <i class="fab fa-facebook-f"></i> Connect on Facebook
            </a>
            <a href="https://x.com/AriumTravel" target="_blank" class="social-btn twitter">
                <i class="fab fa-x-twitter"></i> Follow on X (Twitter)
            </a>
            <a href="https://wa.me/919889890368?text=Hello%20Arium%20Holidays,%20I%20want%20to%20enquire%20about%20tour%20packages." target="_blank" class="social-btn whatsapp">
                <i class="fab fa-whatsapp"></i> Chat on WhatsApp
            </a>
        </div>

        <!-- Quick Enquiry Form -->
        <div class="enquiry-box">
            <h3><i class="fas fa-paper-plane"></i> Quick Tour Enquiry</h3>
            <form id="enquiryForm" onsubmit="sendToWhatsApp(event)">
                <div class="form-group">
                    <label>Your Name:</label>
                    <input type="text" id="name" class="form-control" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label>Phone Number:</label>
                    <input type="tel" id="phone" class="form-control" placeholder="Enter mobile number" required>
                </div>
                <div class="form-group">
                    <label>Destination / Package:</label>
                    <input type="text" id="destination" class="form-control" placeholder="Where do you want to go?" required>
                </div>
                <button type="submit" class="submit-btn"><i class="fab fa-whatsapp"></i> Send Enquiry to WhatsApp</button>
            </form>
        </div>

        <!-- Founder Details -->
        <div class="founder-section">
            Founder & Managing Director<br>
            <span>Sandeep Kumar Maurya</span>
        </div>
    </div>

    <script>
        function sendToWhatsApp(event) {
            event.preventDefault();
            let name = document.getElementById('name').value;
            let phone = document.getElementById('phone').value;
            let destination = document.getElementById('destination').value;

            let whatsappUrl = `https://wa.me/919889890368?text=New%20Tour%20Enquiry:%0A*Name:*%20${encodeURIComponent(name)}%0A*Phone:*%20${encodeURIComponent(phone)}%0A*Destination:*%20${encodeURIComponent(destination)}`;
            
            window.open(whatsappUrl, '_blank');
        }
    </script>
</body>
</html>
